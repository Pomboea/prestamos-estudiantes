# Entorno local: API FastAPI + PostgreSQL 16. Uso: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prestamos
      POSTGRES_PASSWORD: prestamos
      POSTGRES_DB: prestamos
    ports: ["5433:5432"]   # 5433 para no chocar con un PostgreSQL local
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prestamos"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://prestamos:prestamos@db:5432/prestamos
      SECRET_KEY: ${SECRET_KEY:-cambie-esta-clave-secreta}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
