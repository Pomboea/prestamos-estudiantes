# Blueprint de Render (raíz del repositorio): BD PostgreSQL gratuita + API FastAPI + API Express
# + frontend SvelteKit (sitio estático, Taller 1 Corte 2).
# La BD MySQL de la API Express se crea aparte (Railway/Aiven/Clever Cloud) y se pega en MYSQL_URL.
# En Render: New > Blueprint > conecte el repositorio de GitHub.
databases:
  - name: prestamos-db
    plan: free
    databaseName: prestamos
    user: prestamos

services:
  - type: web
    name: api-prestamos-fastapi
    runtime: python
    plan: free
    rootDir: api-fastapi
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.db.inicializar && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: prestamos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: "*"   # o la URL del frontend, p. ej. https://prestamos-frontend-svelte.onrender.com
      - key: FORZAR_SEMILLA
        value: "false"   # "true" recrea esquema + semilla en cada arranque

  - type: web
    name: api-prestamos-express
    runtime: node
    plan: free
    rootDir: api-express
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: MYSQL_URL
        sync: false
      - key: DB_SSL
        value: "false"
      - key: SECRET_KEY
        sync: false   # debe ser igual a la SECRET_KEY de la API FastAPI
      - key: CORS_ORIGINS
        value: "*"
      - key: FORZAR_SEMILLA
        value: "false"

  # Frontend SvelteKit (adapter-static). Todas las rutas se reescriben a index.html (SPA).
  - type: web
    name: prestamos-frontend-svelte
    runtime: static
    rootDir: presU
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://api-prestamos-fastapi.onrender.com
      - key: VITE_API_AUX_URL
        value: https://api-prestamos-express.onrender.com
